name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        toolchain: ['1.88.0', '1.99.1']
        include:
          - os: ubuntu-24.04
            toolchain: stable
    env:
      # Also governs rustc/Cargo subprocesses in temporary native consumers.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: checkout
        with:
          persist-credentials: false
      - name: Install selected compiler
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          cargo -V
      - name: Workspace regressions, including native consumers
        run: |
          mkdir -p "$RUNNER_TEMP/checkmate-logs"
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/checkmate-logs/tests.txt"
          cargo run --locked -p checkmate-example
      - name: Verify repository inputs were not changed
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-${{ matrix.os }}-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/checkmate-logs
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: checkout
        with:
          persist-credentials: false
      - name: Install development tools
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt -p checkmate --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
      - name: Verify repository inputs were not changed
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"

  editor:
    name: Pinned rust-analyzer LSP
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the pinned macro server and sources
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
          test "$(rustc --version)" = 'rustc 1.99.1 (58cf8f9c3 2026-10-13)'
          test -x "$(rustc --print sysroot)/libexec/rust-analyzer-proc-macro-srv"
      - name: Download and verify the tested editor release
        env:
          RA_URL: https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-12/rust-analyzer-x86_64-unknown-linux-gnu.gz
          RA_SHA256: 040cab4e2abc490fadd95c3f6cbc60b941a78761dbc3acf0ec66fd7a97f31db3
        run: |
          curl --fail --location --retry 3 "$RA_URL" -o "$RUNNER_TEMP/rust-analyzer.gz"
          printf '%s  %s\n' "$RA_SHA256" "$RUNNER_TEMP/rust-analyzer.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/rust-analyzer.gz" > "$RUNNER_TEMP/rust-analyzer"
          chmod +x "$RUNNER_TEMP/rust-analyzer"
          version="$("$RUNNER_TEMP/rust-analyzer" --version)"
          printf '%s\n' "$version"
          # This verified Linux asset omits the commit/date printed by the macOS build.
          test "$version" = 'rust-analyzer 0.3.3081-standalone'
      - name: Fetch locked dependencies and check example targets
        run: cargo check --workspace --all-targets --locked
      - name: Real expansions, hovers, diagnostics, rejection, and recovery
        run: |
          mkdir -p "$RUNNER_TEMP/checkmate-logs"
          python3 scripts/test_rust_analyzer.py "$RUNNER_TEMP/rust-analyzer" --timeout 180 2>&1 | tee "$RUNNER_TEMP/checkmate-logs/editor.txt"
      - name: Verify repository inputs were not changed
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve editor output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: editor-linux-pinned
          path: ${{ runner.temp }}/checkmate-logs
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: CI required
    if: always()
    needs: [rust, quality, editor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg and quality/editor job to succeed
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          EDITOR_RESULT: ${{ needs.editor.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$EDITOR_RESULT" = success
